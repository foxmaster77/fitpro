<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="fitpro">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>fitpro</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #fitpro-web-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #05070d;
      transition: opacity 180ms ease;
    }

    #fitpro-web-loader.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader {
      width: 35px;
      height: 80px;
      position: relative;
    }

    .loader:after {
      content: "";
      position: absolute;
      inset: 0;
      padding: 3px 5px;
      border-top: 1px solid #bbb6aa;
      border-bottom: 4px solid #bbb6aa;
      background:
        linear-gradient(#612329 0 0) bottom no-repeat content-box,
        #e4e0d7;
      mix-blend-mode: darken;
      animation: l1 1.5s infinite linear;
    }

    .loader:before {
      content: "";
      position: absolute;
      inset: -18px calc(50% - 2px) 8px;
      background: #eb6b3e;
      transform-origin: bottom;
      transform: rotate(8deg);
    }

    @keyframes l1 {
      0% { background-size: 100% 100%; }
      100% { background-size: 100% 5%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader:after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="fitpro-web-loader" aria-label="Loading FITPRO">
    <div class="loader"></div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.setTimeout(function () {
      var loader = document.getElementById('fitpro-web-loader');
      if (!loader) return;
      loader.classList.add('is-hidden');
      window.setTimeout(function () { loader.remove(); }, 220);
    }, 1500);
  </script>
</body>
</html>
