name: fitpro
description: Privacy-first Flutter fitness app with an AI coach, unified health logging, and hybrid freemium.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  google_fonts: ^6.2.1
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  encrypt: ^5.0.3
  uuid: ^4.5.1
  intl: ^0.20.2
  flutter_animate: ^4.5.2
  lottie: ^3.1.2
  google_generative_ai: ^0.4.5
  purchases_flutter: ^8.3.0
  sqflite_common_ffi_web: ^1.1.1
  camera: ^0.12.0+2
  google_mlkit_pose_detection: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - gradient-fitness-app-template/10085937.jpg
